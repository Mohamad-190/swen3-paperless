server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (PDFs) duerfen groesser als das Default-Limit von 1 MB sein
    client_max_body_size 50m;

    # REST-Server: /api/documents -> http://webapi:8080/documents
    location /api/ {
        proxy_pass http://webapi:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Dashboard und Detailseiten
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
